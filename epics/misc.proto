# ./dtwinApp/Db/misc.proto

Terminator = CR LF;

send_quit { out "quit"; ExtraInput = Ignore; }
send_misalign { out "MISALIGN %f"; ExtraInput = Ignore; }
reset { out "RESET %f"; ExtraInput = Ignore; }
show_screens { out "SHOW_SCREENS %f"; ExtraInput = Ignore; }

get_bpmx { out "IPM.XPOS?"; in "IPM.XPOS %f"; separator=" "; ExtraInput = Ignore; }
get_bpmy { out "IPM.YPOS?"; in "IPM.YPOS %f"; separator=" "; ExtraInput = Ignore; }
get_bpm { out "ALLBPM?"; in "ALLBPM %f"; separator=" "; ExtraInput = Ignore; }

set_screen { out "SCREEN %s"; }
get_sigmas { in "SIGMAS %f"; separator=" "; }

set_tm_from { out "TM.FROM %s"; }
set_tm_to { out "TM.TO %s"; }
get_tm { in "TM %f"; separator=" "; }

get_allbpm { in "ALLBPM %f"; separator=" "; }

# set the power supplies for the solenoids
set_MFX2I01 { out "MFX2I01.BDL %f"; }
set_MFX1I03 { out "MFX1I03.BDL %f"; }
set_MFG1I04 { out "MFG1I04.BDL %f"; }
set_MFX0I01 { out "MFX0I01.BDL %f"; }